<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Clases</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Listado de clases</h1>
        <a th:href="@{/clases/nuevo}" class="btn btn-primary">Añadir clase</a>
    </div>

    <table class="table table-striped">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Nº de pista</th>
                <th>Capacidad</th>
            </tr>
        </thead>
        <tbody>
            <!-- OJO: ahora iteramos sobre clases.content -->
            <tr th:each="c : ${clases.content}">
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.num_pista}"></td>
                <td th:text="${c.capacidad}"></td>

                <td class="d-flex gap-2 justify-content-center">
                    <a th:href="@{'/clases/' + ${c.id} + '/editar'}"
                       class="btn btn-sm btn-warning">
                        Editar
                    </a>

                    <form th:action="@{'/clases/' + ${c.id} + '/borrar'}"
                          method="post"
                          style="display:inline;">
                        <button type="submit"
                                class="btn btn-sm btn-danger"
                                onclick="return confirm('¿Borrar esta clase?')">
                            Borrar
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- PAGINACIÓN -->
    <nav>
        <ul class="pagination justify-content-center">

            <!-- Inicio -->
            <li th:if="${clases.number > 0}" class="page-item">
                <a th:href="@{/clases(page=0)}" class="page-link">Inicio</a>
            </li>

            <!-- Anterior -->
            <li th:if="${clases.hasPrevious()}" class="page-item">
                <a th:href="@{/clases(page=${clases.number - 1})}" class="page-link">Anterior</a>
            </li>

            <!-- Página actual -->
            <li class="page-item active">
                <span class="page-link"
                      th:text="${clases.number + 1}"></span>
            </li>

            <!-- Siguiente -->
            <li th:if="${clases.hasNext()}" class="page-item">
                <a th:href="@{/clases(page=${clases.number + 1})}" class="page-link">Siguiente</a>
            </li>

            <!-- Fin -->
            <li th:if="${clases.number + 1 < clases.totalPages}" class="page-item">
                <a th:href="@{/clases(page=${clases.totalPages - 1})}"
                   class="page-link">Fin</a>
            </li>

        </ul>
    </nav>

</body>
</html>
