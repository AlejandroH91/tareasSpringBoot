<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Principal</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Cabecera -->
    <header class="bg-primary text-white text-center py-5 mb-5">
        <h1>Panel Principal</h1>
    </header>

    <!-- Contenido central -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <table class="table table-bordered table-striped text-center shadow-sm">
                    <thead class="table-dark">
                        <tr>
                            <th>Opciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <a th:href="@{/clases}" class="btn btn-primary w-100 mb-2">Listado de Clases</a>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <a th:href="@{/usuarios}" class="btn btn-success w-100 mb-2">Listado de Usuarios</a>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <a th:href="@{/deportes}" class="btn btn-warning w-100 mb-2">Listado de Deportes</a>
                            </td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
