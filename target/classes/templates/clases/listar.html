<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Clases</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Cabecera -->
    <header class="bg-primary text-white text-center py-5 mb-5">
        <h1>Listado de Clases</h1>
    </header>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="mb-4 text-center">
                    <a th:href="@{/clases/nuevo}" class="btn btn-success">Añadir clase</a>
                </div>

                <table class="table table-striped table-bordered shadow-sm text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>Nombre</th>
                            <th>Nº de pista</th>
                            <th>Capacidad</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${clases.content}">
                            <td th:text="${c.nombre}"></td>
                            <td th:text="${c.num_pista}"></td>
                            <td th:text="${c.capacidad}"></td>
                            <td class="d-flex gap-2 justify-content-center">
                                <a th:href="@{'/clases/' + ${c.id} + '/editar'}" class="btn btn-sm btn-warning">
                                    Editar
                                </a>
                                <form th:action="@{'/clases/' + ${c.id} + '/borrar'}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Borrar esta clase?')">
                                        Borrar
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

				<nav>
				    <ul class="pagination justify-content-center">

				        <!-- Anterior -->
				        <li th:classappend="${!clases.hasPrevious()} ? 'disabled' : ''" class="page-item">
				            <a th:href="@{/clases(page=${clases.number - 1})}" class="page-link">Anterior</a>
				        </li>

				        <!-- Página actual -->
				        <li class="page-item active">
				            <span class="page-link" th:text="${clases.number + 1}"></span>
				        </li>

				        <!-- Siguiente -->
				        <li th:classappend="${!clases.hasNext()} ? 'disabled' : ''" class="page-item">
				            <a th:href="@{/clases(page=${clases.number + 1})}" class="page-link">Siguiente</a>
				        </li>

				    </ul>
				</nav>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
